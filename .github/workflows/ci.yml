name: CI

on:
  push:
    branches: [main, master, jureQA]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/EventEase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/EventEase/package-lock.json

      - run: npm ci
      - run: npm run lint

      # Neuspešen test ali pokritost pod pragom (glej package.json) ustavi cevovod.
      - name: Testi enot s pokritostjo
        shell: bash
        run: npm run test:coverage | tee test-output.txt

      - name: Povzetek pokritosti
        if: always()
        shell: bash
        run: |
          {
            echo "## Pokritost kode (frontend)"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Naloži poročilo o pokritosti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: |
            frontend/EventEase/coverage/lcov.info
            frontend/EventEase/test-output.txt
          if-no-files-found: warn

      - run: npm run build

  backend:
    name: Backend (Zig)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/logic
    steps:
      - uses: actions/checkout@v4

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - run: zig build
      - run: zig build test --summary all

  docker-smoke:
    name: Docker + API smoke
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - run: docker compose build

      - run: docker compose up -d

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ && break
            sleep 2
          done

      - run: sudo apt-get update && sudo apt-get install -y jq

      - run: bash scripts/ci-smoke-test.sh http://localhost:8080

      # Funkcionalni testi (Playwright Test, docs/testiranje/Porocilo_avtomatizacije.md).
      # Testi s pričakovano napako (znane napake INC-xx) cevovoda ne ustavijo; vsak drug neuspeh ga.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Namesti Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Funkcionalni testi (Playwright)
        working-directory: tests/e2e
        env:
          CI: "true"
          BASE_URL: http://localhost:8080
          TEST_DATABASE_URL: postgresql://admin:admin@localhost:5432/eventeasedb
        run: npx playwright test

      - name: Povzetek funkcionalnih testov
        if: always()
        working-directory: tests/e2e
        run: |
          [ -f test-results/rezultati.json ] || exit 0
          jq -r '
            def rows: .suites[] | (.suites // [])[] | .specs[] | . as $s | .tests[0] as $t |
              "| \($s.title) | \($t.results[-1].status) | \(if $t.expectedStatus == "failed" then "pričakovano neuspešen (" + ([$t.annotations[] | select(.type == "znana napaka") | .description] | join(", ")) + ")" else "mora uspeti" end) | \(if $s.ok then "✅" else "❌" end) |";
            "## Funkcionalni testi (Playwright)",
            "",
            "Po pričakovanju: \(.stats.expected), nepričakovano: \(.stats.unexpected), preskočenih: \(.stats.skipped)",
            "",
            "| Primer | Izid | Pričakovanje | OK |",
            "|---|---|---|---|",
            rows
          ' test-results/rezultati.json >> "$GITHUB_STEP_SUMMARY"

      - name: Naloži poročilo Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-porocilo
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: warn

      - if: always()
        run: docker compose down -v
